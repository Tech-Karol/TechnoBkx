name: Update Firefox Stable

on:
  schedule:
    # Codziennie o 12:00 UTC
    - cron: "0 12 * * *"

  # Pozwala uruchomić aktualizację ręcznie
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-firefox:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź najnowszą wersję Firefox Stable
        id: firefox
        shell: bash
        run: |
          set -e

          VERSION=$(curl -fsSL \
            "https://product-details.mozilla.org/1.0/firefox_versions.json" \
            | jq -r '.LATEST_FIREFOX_VERSION')

          echo "Najnowszy Firefox Stable: $VERSION"

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Nie udało się pobrać wersji Firefoxa."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zbuduj link do instalatora
        id: download
        shell: bash
        run: |
          VERSION="${{ steps.firefox.outputs.version }}"

          URL="https://download-installer.cdn.mozilla.net/pub/firefox/releases/${VERSION}/win64/pl/Firefox%20Setup%20${VERSION}.exe"

          echo "URL: $URL"

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Sprawdź aktualną wersję w firefox.html
        id: current
        shell: bash
        run: |
          CURRENT=$(grep -oE 'Firefox</h1>|Firefox [0-9]+\.[0-9]+' programs/firefox.html \
            | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' \
            | head -1 || true)

          echo "Aktualna wersja w repo: $CURRENT"

          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Aktualizuj firefox.html
        shell: bash
        run: |
          VERSION="${{ steps.firefox.outputs.version }}"
          URL="${{ steps.download.outputs.url }}"

          python3 <<PY
          from pathlib import Path
          import re

          path = Path("programs/firefox.html")
          text = path.read_text(encoding="utf-8")

          version = "${VERSION}"
          url = "${URL}"

          # Aktualizacja numeru wersji w polu informacji
          text = re.sub(
              r'(<small>Wersja</small>\s*<strong>\s*)[^<]+(\s*</strong>)',
              rf'\g<1>{version}\g<2>',
              text,
              count=1
          )

          # Aktualizacja linku pobierania
          text = re.sub(
              r'href="https://download-installer\.cdn\.mozilla\.net/[^"]+"',
              f'href="{url}"',
              text,
              count=1
          )

          # Aktualizacja tekstu przycisku
          text = re.sub(
              r'Pobierz Firefox(?: [0-9.]+)?',
              f'Pobierz Firefox {version}',
              text,
              count=1
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Sprawdź zmiany
        run: |
          git diff -- programs/firefox.html

      - name: Zapisz aktualizację
        shell: bash
        run: |
          git config user.name "TechnoBkx Bot"
          git config user.email "actions@github.com"

          git add programs/firefox.html

          if git diff --cached --quiet; then
            echo "Firefox jest już aktualny."
            exit 0
          fi

          VERSION="${{ steps.firefox.outputs.version }}"

          git commit -m "Update Firefox to ${VERSION}"
          git push
