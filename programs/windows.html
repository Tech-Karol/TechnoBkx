<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Windows — TechnoBkx</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0d11;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            padding: 20px 40px;
            background: #11141a;
            border-bottom: 1px solid #282d38;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
        }

        .logo span {
            color: #4da3ff;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: #151820;
            border: 1px solid #282d38;
            border-radius: 18px;
            padding: 35px;
        }

        .program-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            background: #087cd1;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 48px;
            font-weight: bold;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .description {
            color: #969daa;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 35px;
        }

        .info-box {
            background: #101319;
            border: 1px solid #282d38;
            border-radius: 12px;
            padding: 18px;
        }

        .info-box small {
            display: block;
            color: #777e8b;
            margin-bottom: 8px;
        }

        .download {
            display: block;
            margin-top: 40px;
            padding: 17px 20px;

            background: #087cd1;
            color: #ffffff;

            text-decoration: none;
            text-align: center;

            border-radius: 10px;

            font-size: 17px;
            font-weight: bold;

            transition: 0.2s;
        }

        .download:hover {
            background: #0a91f0;
            transform: translateY(-2px);
        }

        .note {
            margin-top: 18px;
            color: #777e8b;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .status {
            margin-top: 12px;
            text-align: center;
            color: #777e8b;
            font-size: 12px;
        }

        footer {
            text-align: center;
            color: #686f7c;
            padding: 40px 20px;
        }

        @media (max-width: 650px) {

            header {
                padding: 18px 20px;
            }

            .container {
                margin-top: 30px;
            }

            .card {
                padding: 25px;
            }

            .program-header {
                flex-direction: column;
                text-align: center;
            }

            .info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Techno<span>Bkx</span>
    </div>

</header>


<main class="container">

    <div class="card">

        <div class="program-header">

            <div class="icon">
                ▦
            </div>

            <div>

                <h1>
                    Windows
                </h1>

                <p class="description">
                    System operacyjny Microsoft dla komputerów PC.
                </p>

            </div>

        </div>


        <div class="info">

            <div class="info-box">

                <small>
                    Wydanie
                </small>

                <strong>
                    Windows 11
                </strong>

            </div>


            <div class="info-box">

                <small>
                    Architektura
                </small>

                <strong>
                    x64
                </strong>

            </div>


            <div class="info-box">

                <small>
                    Format
                </small>

                <strong>
                    ISO
                </strong>

            </div>

        </div>


        <a
            id="download"
            class="download"
            href="https://www.microsoft.com/software-download/windows11"
            target="_blank"
            rel="noopener noreferrer"
        >
            ⬇ Pobierz Windows 11 ISO
        </a>


        <p class="note">
            Pobieranie odbywa się bezpośrednio z oficjalnej
            strony Microsoft.
        </p>


        <div
            id="status"
            class="status"
        >
            Oficjalne źródło Microsoft.
        </div>

    </div>

</main>


<footer>

    © 2026 TechnoBkx
</footer>


<script>

    /*
     * Oficjalna strona pobierania Windows 11.
     */

    const MICROSOFT_URL =
        "https://www.microsoft.com/software-download/windows11";


    /*
     * Microsoft nie udostępnia stabilnego,
     * publicznego API do pobierania aktualnego
     * adresu ISO z poziomu zwykłego JavaScriptu.
     *
     * Dlatego nie zgadujemy adresu pliku.
     */

    const download =
        document.getElementById("download");


    download.href =
        MICROSOFT_URL;


    download.target =
        "_blank";


    download.rel =
        "noopener noreferrer";


    /*
     * Gdy Microsoft zmieni wersję Windows,
     * użytkownik nadal trafi na właściwą,
     * oficjalną stronę pobierania.
     */

</script>

</body>
</html>
