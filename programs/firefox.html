<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Firefox — TechnoBkx</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0d11;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            padding: 20px 40px;
            background: #11141a;
            border-bottom: 1px solid #282d38;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
        }

        .logo span {
            color: #4da3ff;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: #151820;
            border: 1px solid #282d38;
            border-radius: 18px;
            padding: 35px;
        }

        .program-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            background: #222631;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 48px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .description {
            color: #969daa;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 35px;
        }

        .info-box {
            background: #101319;
            border: 1px solid #282d38;
            border-radius: 12px;
            padding: 18px;
        }

        .info-box small {
            display: block;
            color: #777e8b;
            margin-bottom: 8px;
        }

        .download-section {
            text-align: center;
            margin-top: 40px;
        }

        .download-button {
            display: inline-block;
            padding: 16px 32px;
            background: #4da3ff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .download-button:hover {
            background: #2d8ff0;
            transform: translateY(-2px);
        }

        .note {
            margin-top: 15px;
            color: #777e8b;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #969daa;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
        }

        footer {
            text-align: center;
            color: #686f7c;
            padding: 40px 20px;
        }

        @media (max-width: 650px) {
            header {
                padding: 18px 20px;
            }

            .container {
                margin-top: 30px;
            }

            .card {
                padding: 25px;
            }

            .program-header {
                flex-direction: column;
                text-align: center;
            }

            .info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        Techno<span>Bkx</span>
    </div>
</header>


<main class="container">

    <div class="card">

        <div id="loading" class="loading">
            Ładowanie informacji o Firefoxie...
        </div>

        <div id="content" style="display: none;">

            <div class="program-header">

                <div class="icon">
                    🦊
                </div>

                <div>
                    <h1 id="name">Firefox</h1>

                    <p id="description" class="description">
                    </p>
                </div>

            </div>


            <div class="info">

                <div class="info-box">
                    <small>Wersja</small>
                    <strong id="version"></strong>
                </div>

                <div class="info-box">
                    <small>System</small>
                    <strong id="system"></strong>
                </div>

                <div class="info-box">
                    <small>Format</small>
                    <strong id="format"></strong>
                </div>

            </div>


            <div class="download-section">

                <a
                    id="download"
                    class="download-button"
                    href="#"
                >
                    ⬇ Pobierz Firefox
                </a>

                <p class="note">
                    Pobieranie odbywa się bezpośrednio z oficjalnego CDN Mozilli.
                </p>

            </div>

        </div>


        <div id="error" class="error" style="display: none;">
            Nie udało się pobrać informacji o Firefoxie.
        </div>

    </div>

</main>


<footer>
    © 2026 TechnoBkx
</footer>


<script>

    const DATA_URL =
        "https://raw.githubusercontent.com/TWOJ_LOGIN/TechnoBkx-Data/main/programs.json";


    async function loadFirefox() {

        try {

            const response = await fetch(DATA_URL, {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Nie udało się pobrać programs.json");
            }

            const data = await response.json();

            const firefox = data.firefox;

            if (!firefox) {
                throw new Error("Brak danych Firefoxa");
            }


            document.getElementById("name").textContent =
                firefox.name;

            document.getElementById("description").textContent =
                firefox.description;

            document.getElementById("version").textContent =
                firefox.version;

            document.getElementById("system").textContent =
                firefox.system;

            document.getElementById("format").textContent =
                firefox.format;


            const download =
                document.getElementById("download");

            download.href =
                firefox.download;

            download.textContent =
                "⬇ Pobierz " +
                firefox.name +
                " " +
                firefox.version;


            document.getElementById("loading").style.display =
                "none";

            document.getElementById("content").style.display =
                "block";

        } catch (error) {

            console.error(error);

            document.getElementById("loading").style.display =
                "none";

            document.getElementById("error").style.display =
                "block";

        }

    }


    loadFirefox();

</script>

</body>
</html>
