<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>7-Zip — TechnoBkx</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0d11;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            padding: 20px 40px;
            background: #11141a;
            border-bottom: 1px solid #282d38;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
        }

        .logo span {
            color: #4da3ff;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: #151820;
            border: 1px solid #282d38;
            border-radius: 18px;
            padding: 35px;
        }

        .program-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            background: #222631;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .description {
            color: #969daa;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 35px;
        }

        .info-box {
            background: #101319;
            border: 1px solid #282d38;
            border-radius: 12px;
            padding: 18px;
        }

        .info-box small {
            display: block;
            color: #777e8b;
            margin-bottom: 8px;
        }

        .downloads {
            margin-top: 40px;
            text-align: center;
        }

        .download-button {
            display: inline-block;
            padding: 16px 32px;

            background: #4da3ff;
            color: white;

            text-decoration: none;
            border-radius: 10px;

            font-size: 17px;
            font-weight: bold;

            transition: 0.2s;
        }

        .download-button:hover {
            background: #2d8ff0;
            transform: translateY(-2px);
        }

        .note {
            margin-top: 15px;
            color: #777e8b;
            font-size: 13px;
        }

        .status {
            margin-top: 15px;
            color: #777e8b;
            font-size: 12px;
        }

        .error {
            color: #ff7070;
        }

        footer {
            text-align: center;
            color: #686f7c;
            padding: 40px 20px;
        }

        @media (max-width: 650px) {

            header {
                padding: 18px 20px;
            }

            .container {
                margin-top: 30px;
            }

            .card {
                padding: 25px;
            }

            .program-header {
                flex-direction: column;
                text-align: center;
            }

            .info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Techno<span>Bkx</span>
    </div>

</header>


<main class="container">

    <div class="card">

        <div class="program-header">

            <div class="icon">
                7Z
            </div>

            <div>

                <h1>
                    7-Zip
                </h1>

                <p class="description">
                    Darmowy program do kompresowania i rozpakowywania plików.
                </p>

            </div>

        </div>


        <div class="info">

            <div class="info-box">

                <small>
                    Wersja
                </small>

                <strong id="version">
                    Sprawdzanie...
                </strong>

            </div>


            <div class="info-box">

                <small>
                    System
                </small>

                <strong>
                    Windows 64-bit
                </strong>

            </div>


            <div class="info-box">

                <small>
                    Format
                </small>

                <strong>
                    EXE
                </strong>

            </div>

        </div>


        <div class="downloads">

            <a
                id="download"
                class="download-button"
                href="#"
            >
                ⏳ Sprawdzanie wersji...
            </a>

            <p class="note">
                Pobieranie odbywa się z oficjalnego wydania 7-Zip.
            </p>

            <div
                id="status"
                class="status"
            >
                Łączenie z oficjalnym repozytorium 7-Zip...
            </div>

        </div>

    </div>

</main>


<footer>

    © 2026 TechnoBkx

</footer>


<script>

    /*
     * Oficjalne repozytorium 7-Zip.
     */

    const API_URL =
        "https://api.github.com/repos/ip7z/7zip/releases/latest";


    /*
     * Oficjalna strona 7-Zip.
     */

    const OFFICIAL_URL =
        "https://www.7-zip.org/download.html";


    async function load7Zip() {

        const versionElement =
            document.getElementById("version");

        const downloadButton =
            document.getElementById("download");

        const statusElement =
            document.getElementById("status");


        try {

            /*
             * Pobieramy najnowszy release.
             */

            const response =
                await fetch(
                    API_URL,
                    {
                        cache: "no-store",
                        headers: {
                            "Accept":
                                "application/vnd.github+json"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "GitHub API zwróciło błąd HTTP " +
                    response.status
                );

            }


            const release =
                await response.json();


            /*
             * Tag wydania, np.:
             *
             * 26.02
             */

            let version =
                release.tag_name;


            /*
             * Usuwamy ewentualne "v"
             * z początku numeru wersji.
             */

            version =
                version.replace(/^v/, "");


            if (!version) {

                throw new Error(
                    "Nie znaleziono numeru wersji."
                );

            }


            /*
             * Szukamy oficjalnego instalatora
             * Windows x64 wśród assetów release.
             *
             * Przykład:
             *
             * 7z2602-x64.exe
             */

            const asset =
                release.assets.find(
                    item =>
                        /7z\d+-x64\.exe$/i.test(
                            item.name
                        )
                );


            if (!asset) {

                throw new Error(
                    "Nie znaleziono instalatora Windows x64."
                );

            }


            /*
             * Aktualna wersja.
             */

            versionElement.textContent =
                version;


            /*
             * Oficjalny plik EXE.
             */

            downloadButton.href =
                asset.browser_download_url;


            downloadButton.target =
                "_blank";


            downloadButton.rel =
                "noopener noreferrer";


            downloadButton.textContent =
                "⬇ Pobierz 7-Zip " +
                version;


            statusElement.textContent =
                "Automatycznie sprawdzono najnowsze wydanie.";


        } catch (error) {

            console.error(
                "TechnoBkx 7-Zip:",
                error
            );


            /*
             * Jeżeli API GitHuba nie odpowiada,
             * nie kierujemy użytkownika
             * do nieistniejącego pliku.
             *
             * Zamiast tego oficjalna strona 7-Zip.
             */

            versionElement.textContent =
                "Sprawdź na stronie 7-Zip";


            downloadButton.href =
                OFFICIAL_URL;


            downloadButton.target =
                "_blank";


            downloadButton.rel =
                "noopener noreferrer";


            downloadButton.textContent =
                "🌐 Oficjalna strona 7-Zip";


            statusElement.textContent =
                "Automatyczne sprawdzanie niedostępne.";

            statusElement.classList.add(
                "error"
            );

        }

    }


    /*
     * Uruchom przy każdym wejściu
     * na stronę.
     */

    load7Zip();

</script>

</body>
</html>
