<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GIMP — TechnoBkx</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0d11;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            padding: 20px 40px;
            background: #11141a;
            border-bottom: 1px solid #282d38;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
        }

        .logo span {
            color: #4da3ff;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: #151820;
            border: 1px solid #282d38;
            border-radius: 18px;
            padding: 35px;
        }

        .program-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            background: #4a3b75;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 48px;
            font-weight: bold;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .description {
            color: #969daa;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 35px;
        }

        .info-box {
            background: #101319;
            border: 1px solid #282d38;
            border-radius: 12px;
            padding: 18px;
        }

        .info-box small {
            display: block;
            color: #777e8b;
            margin-bottom: 8px;
        }

        .downloads {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 40px;
        }

        .download-button {
            display: block;
            padding: 16px 20px;

            background: #4da3ff;
            color: white;

            text-decoration: none;
            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;
            text-align: center;

            transition: 0.2s;
        }

        .download-button:hover {
            background: #2d8ff0;
            transform: translateY(-2px);
        }

        .linux-button {
            background: #252a34;
            border: 1px solid #3a414e;
        }

        .linux-button:hover {
            background: #303642;
        }

        .note {
            margin-top: 18px;
            color: #777e8b;
            font-size: 13px;
            text-align: center;
        }

        .status {
            margin-top: 12px;
            text-align: center;
            color: #777e8b;
            font-size: 12px;
        }

        .error {
            color: #ff7070;
        }

        footer {
            text-align: center;
            color: #686f7c;
            padding: 40px 20px;
        }

        @media (max-width: 650px) {

            header {
                padding: 18px 20px;
            }

            .container {
                margin-top: 30px;
            }

            .card {
                padding: 25px;
            }

            .program-header {
                flex-direction: column;
                text-align: center;
            }

            .info {
                grid-template-columns: 1fr;
            }

            .downloads {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Techno<span>Bkx</span>
    </div>

</header>


<main class="container">

    <div class="card">

        <div class="program-header">

            <div class="icon">
                G
            </div>

            <div>

                <h1>
                    GIMP
                </h1>

                <p class="description">
                    Darmowy i otwartoźródłowy edytor grafiki.
                </p>

            </div>

        </div>


        <div class="info">

            <div class="info-box">

                <small>
                    Wersja
                </small>

                <strong id="version">
                    Sprawdzanie...
                </strong>

            </div>


            <div class="info-box">

                <small>
                    Windows
                </small>

                <strong>
                    64-bit
                </strong>

            </div>


            <div class="info-box">

                <small>
                    Linux
                </small>

                <strong>
                    x64 / ARM64
                </strong>

            </div>

        </div>


        <div class="downloads">

            <a
                id="windowsDownload"
                class="download-button"
                href="#"
            >
                ⏳ Sprawdzanie wersji...
            </a>


            <a
                class="download-button linux-button"
                href="https://www.gimp.org/downloads/"
                target="_blank"
                rel="noopener noreferrer"
            >
                🐧 GIMP dla Linux
            </a>

        </div>


        <p class="note">
            Windows: oficjalny instalator GIMP.
            Linux: oficjalna strona GIMP.
        </p>


        <div
            id="status"
            class="status"
        >
            Łączenie z oficjalnym źródłem GIMP...
        </div>

    </div>

</main>


<footer>

    © 2026 TechnoBkx

</footer>


<script>

    /*
     * Oficjalne repozytorium GIMP.
     *
     * API GitHub pozwala pobrać najnowszy
     * release bez ręcznego wpisywania wersji.
     */

    const API_URL =
        "https://api.github.com/repos/GNOME/gimp/releases/latest";


    /*
     * Oficjalna strona GIMP.
     */

    const OFFICIAL_URL =
        "https://www.gimp.org/downloads/";


    async function loadGIMP() {

        const versionElement =
            document.getElementById("version");

        const downloadButton =
            document.getElementById("windowsDownload");

        const statusElement =
            document.getElementById("status");


        try {

            /*
             * Pobieramy najnowszy release GIMP.
             */

            const response =
                await fetch(
                    API_URL,
                    {
                        cache: "no-store",

                        headers: {
                            "Accept":
                                "application/vnd.github+json"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "GitHub API HTTP " +
                    response.status
                );

            }


            const release =
                await response.json();


            /*
             * Pobieramy numer wersji.
             */

            let version =
                release.tag_name ||
                release.name;


            if (!version) {

                throw new Error(
                    "Nie znaleziono wersji GIMP."
                );

            }


            /*
             * Usuwamy ewentualne "GIMP "
             * oraz "v" z początku.
             */

            version =
                version
                    .replace(/^GIMP\s*/i, "")
                    .replace(/^v/i, "");


            /*
             * Szukamy Windowsowego instalatora.
             *
             * GIMP może zmieniać nazwy assetów,
             * dlatego sprawdzamy kilka możliwych
             * wariantów.
             */

            const assets =
                release.assets || [];


            let installer =
                assets.find(
                    asset =>
                        /windows/i.test(asset.name) &&
                        /\.exe$/i.test(asset.name)
                );


            /*
             * Jeżeli release nie zawiera EXE,
             * szukamy dowolnego instalatora EXE.
             */

            if (!installer) {

                installer =
                    assets.find(
                        asset =>
                            /\.exe$/i.test(
                                asset.name
                            )
                    );

            }


            /*
             * Jeżeli znaleziono instalator,
             * używamy oficjalnego assetu GitHub.
             */

            if (installer) {

                downloadButton.href =
                    installer.browser_download_url;

                downloadButton.target =
                    "_blank";

                downloadButton.rel =
                    "noopener noreferrer";

                downloadButton.textContent =
                    "⬇ Pobierz GIMP " +
                    version;

                statusElement.textContent =
                    "Automatycznie wykryto najnowszą wersję.";

            } else {

                /*
                 * Brak EXE w Release.
                 *
                 * Nie zgadujemy adresu pliku.
                 * Kierujemy użytkownika na oficjalną
                 * stronę pobierania GIMP.
                 */

                downloadButton.href =
                    OFFICIAL_URL;

                downloadButton.target =
                    "_blank";

                downloadButton.rel =
                    "noopener noreferrer";

                downloadButton.textContent =
                    "🌐 Pobierz GIMP z oficjalnej strony";

                statusElement.textContent =
                    "Wersja wykryta, ale brak bezpośredniego instalatora.";

            }


            versionElement.textContent =
                version;


        } catch (error) {

            console.error(
                "TechnoBkx GIMP:",
                error
            );


            /*
             * Fallback:
             *
             * jeśli GitHub API nie działa,
             * nie zgadujemy wersji ani pliku.
             */

            versionElement.textContent =
                "Sprawdź na stronie GIMP";


            downloadButton.href =
                OFFICIAL_URL;


            downloadButton.target =
                "_blank";


            downloadButton.rel =
                "noopener noreferrer";


            downloadButton.textContent =
                "🌐 Oficjalna strona GIMP";


            statusElement.textContent =
                "Automatyczne sprawdzanie niedostępne.";

            statusElement.classList.add(
                "error"
            );

        }

    }


    /*
     * Sprawdzamy przy każdym wejściu
     * na stronę.
     */

    loadGIMP();

</script>

</body>
</html>
